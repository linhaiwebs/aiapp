version: '3.8'

# 适合服务器已有 Nginx 的部署方式
# 宿主机 Nginx (80/443) → Docker Server (3000)
# 无需 Docker 内 Nginx，避免双重代理
# Postgres/Redis/MinIO 仅容器内网互通，不暴露端口
#
# 使用方式：
# 1. cp .env.example .env  修改配置
# 2. docker-compose -f docker-compose.host-nginx.yml up -d
# 3. 在宝塔 Nginx 中配置反向代理（参考 DEPLOY_GUIDE.md）

services:
  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    ports:
      - "${SERVER_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_TYPE=${DB_TYPE:-postgres}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_DATABASE=${DB_DATABASE:-xcai}
      - DB_SYNCHRONIZE=${DB_SYNCHRONIZE:-true}
      - DB_LOGGING=${DB_LOGGING:-false}
      - REDIS_ENABLED=${REDIS_ENABLED:-true}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - STORAGE_TYPE=${STORAGE_TYPE:-minio}
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-xcai}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production}
      - JWT_ACCESS_EXPIRES_IN=${JWT_ACCESS_EXPIRES_IN:-15m}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - SMS_PROVIDER=${SMS_PROVIDER:-mock}
      - SMS_APP_CODE=${SMS_APP_CODE:-}
      - SMS_TEMPLATE_ID=${SMS_TEMPLATE_ID:-}
      - SMS_MARKET_HOST=${SMS_MARKET_HOST:-send.market.alicloudapi.com}
      - SMS_MARKET_PATH=${SMS_MARKET_PATH:-/sms/send}
      - SMS_CODE_LENGTH=${SMS_CODE_LENGTH:-6}
      - SMS_CODE_TTL=${SMS_CODE_TTL:-300}
      - SMS_CODE_COOLDOWN=${SMS_CODE_COOLDOWN:-60}
      - SMS_MAX_SEND_PER_DAY=${SMS_MAX_SEND_PER_DAY:-10}
      - REAL_NAME_APP_CODE=${REAL_NAME_APP_CODE:-}
      - REAL_NAME_VERIFY_HOST=${REAL_NAME_VERIFY_HOST:-zidv2.market.alicloudapi.com}
      - REAL_NAME_VERIFY_PATH=${REAL_NAME_VERIFY_PATH:-/idcheck/Post}
      - REAL_NAME_OCR_HOST=${REAL_NAME_OCR_HOST:-zidv2.market.alicloudapi.com}
      - REAL_NAME_OCR_FRONT_PATH=${REAL_NAME_OCR_FRONT_PATH:-}
      - REAL_NAME_OCR_BACK_PATH=${REAL_NAME_OCR_BACK_PATH:-}
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - APP_VERSION_CODE=${APP_VERSION_CODE:-1}
      - APP_DOWNLOAD_URL=${APP_DOWNLOAD_URL:-}
      - APP_CHANGELOG=${APP_CHANGELOG:-}
      - APP_FORCE_UPDATE=${APP_FORCE_UPDATE:-false}
      - OSS_REGION=${OSS_REGION:-oss-cn-hangzhou}
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID:-}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET:-}
      - OSS_BUCKET=${OSS_BUCKET:-xcai}
      - OSS_ENDPOINT=${OSS_ENDPOINT:-}
      - OSS_CDN_DOMAIN=${OSS_CDN_DOMAIN:-}
    volumes:
      - server_data:/app/data
      # APK 下载目录（放 app-release.apk 到这里即可更新）
      - ../server/public/dist:/app/public/dist
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    # 不暴露端口 - 仅 Docker 内网访问，避免与宿主机 PG 冲突
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-xcai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # 不暴露端口 - 仅 Docker 内网访问
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis_data:/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    # 不暴露端口 - 仅 Docker 内网访问
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  server_data:
